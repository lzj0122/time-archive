<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">协同攻关关系自制示意图</title>
  <desc id="desc">中央专委统筹科研人员、工程技术与管理人员和基地建设者，协同完成第一颗原子弹研制，不是历史现场照片。</desc>
  <rect width="1400" height="900" fill="#f4efe4"/>
  <rect x="70" y="70" width="1260" height="760" rx="28" fill="#ffffff" opacity="0.66"/>
  <text x="130" y="150" fill="#15324a" font-family="serif" font-size="58" font-weight="700">协同攻关关系</text>
  <text x="132" y="202" fill="#a33b2b" font-family="sans-serif" font-size="28">全国“一盘棋” · 依据 S1 官方史料绘制</text>
  <g stroke="#15324a" stroke-width="4" opacity="0.42">
    <line x1="700" y1="320" x2="310" y2="450"/>
    <line x1="700" y1="320" x2="700" y2="450"/>
    <line x1="700" y1="320" x2="1090" y2="450"/>
    <line x1="310" y1="580" x2="700" y2="680"/>
    <line x1="700" y1="580" x2="700" y2="680"/>
    <line x1="1090" y1="580" x2="700" y2="680"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="430" y="250" width="540" height="120" rx="60" fill="#15324a"/>
    <text x="700" y="322" fill="#ffffff" font-family="serif" font-size="38" font-weight="700">中央专门委员会</text>
    <rect x="120" y="440" width="380" height="140" rx="20" fill="#ffffff" stroke="#a33b2b" stroke-width="3"/>
    <text x="310" y="505" fill="#15324a" font-family="serif" font-size="36" font-weight="700">科研人员</text>
    <text x="310" y="552" fill="#15324a" font-size="25">理论 · 设计 · 实验</text>
    <rect x="510" y="440" width="380" height="140" rx="20" fill="#ffffff" stroke="#a33b2b" stroke-width="3"/>
    <text x="700" y="505" fill="#15324a" font-family="serif" font-size="34" font-weight="700">工程技术与管理人员</text>
    <text x="700" y="552" fill="#15324a" font-size="25">组织 · 保障 · 协作</text>
