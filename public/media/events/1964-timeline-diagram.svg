<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">“两弹一星”研制进程自制示意图</title>
  <desc id="desc">展示二十世纪五十年代中期、1962 年中央专委成立和 1964 年第一颗原子弹爆炸成功三个节点，不是历史现场照片。</desc>
  <rect width="1400" height="900" fill="#f4efe4"/>
  <rect x="70" y="70" width="1260" height="760" rx="28" fill="#ffffff" opacity="0.66"/>
  <text x="130" y="150" fill="#15324a" font-family="serif" font-size="58" font-weight="700">“两弹一星”研制进程</text>
  <text x="132" y="202" fill="#a33b2b" font-family="sans-serif" font-size="28">三个关键节点 · 依据 S1 官方史料绘制</text>
  <line x1="220" y1="470" x2="1180" y2="470" stroke="#15324a" stroke-width="6"/>
  <g fill="#f4efe4" stroke="#15324a" stroke-width="6">
    <circle cx="250" cy="470" r="28"/>
    <circle cx="700" cy="470" r="28"/>
    <circle cx="1150" cy="470" r="34" fill="#a33b2b" stroke="#a33b2b"/>
  </g>
  <g font-family="sans-serif" fill="#15324a">
    <text x="250" y="390" text-anchor="middle" font-size="34" font-weight="700">20 世纪 50 年代中期</text>
    <text x="250" y="545" text-anchor="middle" font-size="30">决定发展以“两弹一星”</text>
    <text x="250" y="590" text-anchor="middle" font-size="30">为核心的国防尖端科技</text>
    <text x="700" y="390" text-anchor="middle" font-size="34" font-weight="700">1962 年 11 月</text>
    <text x="700" y="545" text-anchor="middle" font-size="30">中央专委成立</text>
    <text x="700" y="590" text-anchor="middle" font-size="30">全国“一盘棋”协同攻关</text>
    <text x="1150" y="370" text-anchor="middle" font-size="38" font-weight="700" fill="#a33b2b">1964 年 10 月 16 日</text>
    <text x="1150" y="545" text-anchor="middle" font-size="30">第一颗原子弹</text>
    <text x="1150" y="590" text-anchor="middle" font-size="30">在新疆罗布泊爆炸成功</text>
  </g>
  <rect x="130" y="700" width="1140" height="74" rx="14" fill="#15324a"/>
  <text x="700" y="748" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="30">自力更生为主 · 争取外援为辅 · 大力协同</text>
  <text x="130" y="812" fill="#a33b2b" font-family="sans-serif" font-size="23">Time Archive 项目组自制 · 2026-11-29 · CC0（自制） · 示意，非历史现场照片</text>
</svg>
